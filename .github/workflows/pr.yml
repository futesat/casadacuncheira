name: Pull Request Quality Gate

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npm run typecheck

  i18n-parity:
    name: i18n Dictionary Parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify 7-Language Parity
        run: npm run test:i18n

  build:
    name: Immutable Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, i18n-parity]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and prerender static pages
        run: npm run build

      - name: Create 404.html for SPA routing fallback
        run: cp dist/index.html dist/404.html

      - name: Upload PR build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-dist
          path: ./dist
          if-no-files-found: error
          retention-days: 3

  test-e2e:
    name: Playwright E2E Quality Suite
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers with OS dependencies
        run: npx playwright install --with-deps

      - name: Download PR build artifact
        uses: actions/download-artifact@v4
        with:
          name: pr-dist
          path: dist

      - name: Run Playwright E2E tests
        run: npx playwright test

      - name: Upload Playwright test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-playwright-report
          path: playwright-report/
          retention-days: 7

  pr-quality-gate:
    name: PR Quality Gate
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, i18n-parity, build, test-e2e]
    steps:
      - name: Verify All PR Checks Passed
        run: |
          echo "============================================="
          echo " ✅ PR QUALITY GATE PASSED: READY FOR MERGE"
          echo "============================================="
